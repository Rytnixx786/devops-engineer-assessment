name: Quality
on: [pull_request, workflow_call]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-go@v7
        with: {go-version: '1.26.5'}
      - name: Lint and test
        run: |
          test -z "$(gofmt -l cmd)"
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          shellcheck system_health.sh scripts/*.sh observability/start-node-exporter.sh
          bash scripts/test-health.sh
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - uses: actions/upload-artifact@v7
        with: {name: coverage, path: coverage.out}
      - name: Test deploy and rollback script
        run: |
          docker run --rm -v "$PWD/scripts:/src/scripts:ro" debian:bookworm-slim bash -ec \
            'apt-get update -qq && apt-get install -y -qq jq >/dev/null && bash /src/scripts/test-release.sh'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.1'
      - name: Validate and test Terraform
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
          terraform -chdir=infra test
          terraform -chdir=infra/bootstrap fmt -check
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate
      - name: Test alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/rules:ro" -w /rules prom/prometheus:v3.6.0 test rules tests.yml
      - name: Build and scan
        run: |
          docker build -t assessment:scan .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --severity CRITICAL --exit-code 1 assessment:scan
