name: Release
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: assessment-main
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DOCUMENT: ${{ vars.SSM_DOCUMENT }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable release
        id: release
        run: |
          set -euo pipefail
          base=$(cat VERSION)
          [[ $base =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$base-build.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # An immutable SHA may already exist on retry. Accept only the same paired tag.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" > "$RUNNER_TEMP/image.json"; then
            jq -e --arg v "$version" '.imageDetails[0].imageTags | index($v) != null' "$RUNNER_TEMP/image.json"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        if: steps.release.outputs.exists != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy and collect smoke or recovery result
        run: |
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DOCUMENT" --parameters "tag=$GITHUB_SHA" --query Command.CommandId --output text)
          result=0
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$cmd" || result=$?
          aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$cmd" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          exit "$result"
